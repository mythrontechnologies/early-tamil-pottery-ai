# Early Tamil Pottery AI — project configuration
#
# Single source of truth for project-level constants. Nothing here is hard-coded in src/.
# Anything with verification_status other than `verified_against_source` MUST NOT reach the UI
# as evidence — the Milestone 11 retrieval layer filters on this field.

project:
  name: early-tamil-pottery-ai
  schema_version: "1.2.0"
  description: >-
    AI-assisted analysis of Early Historic Tamil Nadu pottery, with emphasis on
    Tamil-Brahmi/Tamili inscriptions and graffiti. Research prototype.
  disclaimer: >-
    This system provides AI-assisted archaeological analysis and is not a substitute for
    expert epigraphic or archaeological assessment.

scope:
  region: "Tamil Nadu, South India"
  artifact_focus: "pottery sherds and fragments"
  primary_feature: "Tamil-Brahmi/Tamili inscriptions and graffiti on pottery"

# ---------------------------------------------------------------------------
# Chronology. See docs/CHRONOLOGICAL_SCOPE.md.
# Years are signed integers: negative = BCE, positive = CE, no year 0.
# NOTHING HERE IS VERIFIED. These are provisional working bounds, not assertions
# about when Tamil-Brahmi began. The earliest date of Tamil-Brahmi is contested;
# the system reports the disagreement rather than resolving it.
# ---------------------------------------------------------------------------
chronology:

  ingestion_scope:
    comment: >-
      Deliberately generous so that material relevant to the early-date positions is not
      excluded by an assumption made before the evidence was examined.
    lower_year: -600
    upper_year: 600
    verification_status: unverified
    source_ref: "docs/CHRONOLOGICAL_SCOPE.md#5"

  modelling_scope:
    comment: "Where data density is expected to be highest. Not a claim about script origins."
    lower_year: -300
    upper_year: 300
    verification_status: unverified
    source_ref: "docs/CHRONOLOGICAL_SCOPE.md#5"

  # Competing scholarly positions on the earliest Tamil-Brahmi.
  # The prototype surfaces these; it does not pick one.
  tamil_brahmi_earliest_positions:
    - id: A
      label: "Conventional / epigraphic"
      lower_year: -300
      upper_year: -100
      basis: [palaeography]
      reference: R1
      verification_status: unverified
    - id: B
      label: "Early AMS determinations"
      lower_year: -500
      upper_year: -400
      basis: [ams_radiocarbon, stratigraphy]
      reference: R3
      verification_status: unverified
    - id: C
      label: "Keeladi / TNSDA"
      lower_year: -600
      upper_year: -500
      basis: [ams_radiocarbon, stratigraphy]
      reference: R6
      verification_status: unverified
    - id: D
      label: "Sceptical — association not secure"
      kind: methodological_objection   # not a rival date; applies to B and C
      basis: [published_attribution]
      reference: R5
      verification_status: unverified

  # How the dating stage combines the above when a record's own evidence is insufficient.
  fallback_policy: union_of_cited_positions   # never a midpoint, never a bare percentage

  # Milestone 7. Named periods the reasoning layer may use as LABELS for an estimated
  # range. A label never dates an object; it describes where an evidence-based range falls.
  periods:
    - id: early_historic_tamil_nadu
      label: "Early Historic Tamil Nadu"
      lower_year: -300          # "approximately 3rd century BCE" (CHRONOLOGICAL_SCOPE §3)
      upper_year: 400           # "3rd/4th century CE" (ibid.); sometimes extended to c. 600 CE
      note: "Conventional range; the literary 'Sangam age' is a separate, non-archaeological periodisation."
      verification_status: unverified
      source_ref: "docs/CHRONOLOGICAL_SCOPE.md#3"

# ---------------------------------------------------------------------------
# Milestone 4 classifier
# ---------------------------------------------------------------------------
classification:
  task: script_type
  classes: [tamil_brahmi, graffiti, none, uncertain]
  held_out_labels: [other_script, tamil_brahmi_and_graffiti, unknown]
  held_out_reason: >-
    Real categories, but too few expected examples to model at first and a poor fit for any
    of the four classes. Retained in the dataset, excluded from the initial model.

# ---------------------------------------------------------------------------
# Splitting. See docs/SPLIT_METHODOLOGY.md. Split key is artifact_id, never image_id.
# ---------------------------------------------------------------------------
split:
  group_key: artifact_id
  stratify_by: script_type
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 20260922
  # If the artifact count is too small for a meaningful single split, switch to grouped k-fold
  # and report that instead of a single held-out figure.
  min_artifacts_per_class_for_holdout: 20
  fallback_strategy: grouped_k_fold
  k_folds: 5
  # Milestone 5. Approximate secondary balance, applied WITHIN each script_type class by
  # interleaving whole artifacts. Never overrides artifact grouping. 'period' is absent
  # because the schema records no period field (docs/DATASET_SPLIT.md §5).
  balance_secondary: [inscription_present, site]
  manifest_dir: data/metadata/splits

# ---------------------------------------------------------------------------
# Transliteration / encoding defaults
# ---------------------------------------------------------------------------
text:
  default_transliteration_scheme: iso_15919
  default_transcription_encoding: tamil_unicode

# ---------------------------------------------------------------------------
# Integrity gates enforced across the pipeline
# ---------------------------------------------------------------------------
integrity:
  # Sentinels permitted in place of a value. Empty strings are never permitted.
  sentinels: [unknown, not_available, not_applicable]
  # Records below this verification level cannot be surfaced as evidence in the UI.
  min_verification_for_evidence: verified_against_source
  # Unknown rights are treated as non-redistributable.
  unknown_rights_are_redistributable: false
  # Reading statuses that must never be displayed as settled.
  unsettled_reading_statuses: [published_tentative, disputed, unread, illegible, unknown]

# ---------------------------------------------------------------------------
# Milestone 3 - image preprocessing.
#
# Every value here is an ENGINEERING parameter or an IMAGE-QUALITY heuristic.
# None of it is an archaeological judgement. A quality flag says something about
# the photograph, never about the object, its authenticity or its date.
#
# The thresholds below are provisional defaults chosen a priori. They have never
# been calibrated against real pottery photographs, because none exist yet. They
# must be revisited once real images arrive.
# ---------------------------------------------------------------------------
preprocessing:
  pipeline_version: "1.0.0"

  # Geometry
  target_size: 224                  # square edge, in pixels
  resize_strategy: pad              # pad (letterbox) | crop (centre crop)
  resample: lanczos                 # fixed for determinism
  pad_color: [0, 0, 0]
  # 'pad' is the default because a centre crop can remove the edge of a sherd,
  # and an inscription frequently sits near a break or a rim.

  # Colour
  alpha_background: [255, 255, 255] # RGBA is composited onto this, then flattened
  output_format: png                # lossless, so preprocessing is not re-lossy

  # Hard limits - below these the image is rejected rather than flagged
  min_dimension_px: 32
  max_pixels: 178956970             # Pillow's decompression-bomb ceiling

  supported_formats: [JPEG, PNG, TIFF, BMP, WEBP]

  # Applied at model-load time, not baked into the stored image.
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    source: imagenet
    note: >-
      ImageNet statistics, appropriate for the pretrained backbones named in
      the brief. Recompute from the training split once real data exists.

  # Quality heuristics -> warnings only. Never errors, never archaeological claims.
  quality_thresholds:
    min_dimension_warn: 224         # below the model input size means upscaling
    blur_laplacian_var: 100.0       # lower = softer/blurrier
    dark_mean: 40.0
    bright_mean: 215.0
    low_contrast_std: 20.0
    clip_fraction: 0.05             # fraction of pixels at 0 or at 255
    max_aspect_ratio: 4.0

# ---------------------------------------------------------------------------
# Milestone 8 - expert annotation pilot, agreement, reference verification, promotion.
# See docs/MILESTONE_8_REPORT.md. Nothing here is an archaeological claim.
# ---------------------------------------------------------------------------
annotation_pilot:
  id: keezhadi_incised_sherds_m8
  description: >-
    Six Wikimedia Commons close-ups of incised sherds displayed at the Keezhadi site museum
    ("Keeladi-archeological-site-photos" 105-110). Chosen because the photographs are close-ups
    of marked sherds. They are NOT assumed to carry Tamil-Brahmi: presence, script, reading and
    date are for the annotators to establish. The uploader's caption dates the Keeladi deposit
    as a whole; that caption is a site-level statement, never a date for these objects.
  artifacts:
    - WMC_KEELADI_MUS_SHERD_105
    - WMC_KEELADI_MUS_SHERD_106
    - WMC_KEELADI_MUS_SHERD_107
    - WMC_KEELADI_MUS_SHERD_108
    - WMC_KEELADI_MUS_SHERD_109
    - WMC_KEELADI_MUS_SHERD_110
  # Each pilot artifact needs one current annotation from each of these provenance tiers.
  required_tiers: [project_annotation, expert_annotation]

agreement:
  # Below this many paired items a chance-corrected statistic (Cohen's kappa) is still
  # computed and shown beside the raw counts, but reported as NOT interpretable. This is an
  # engineering convention for this project, not a statistical law: with a handful of items
  # one changed judgement moves kappa by a large amount.
  min_items_for_kappa: 30
  # Two regions "match" when their intersection-over-union reaches this value.
  region_iou_match: 0.5

verification:
  # References the Milestone 7 reasoning relies on. Verified only by a human against the
  # physical or authorised publication; see knowledge/verification/README.md.
  key_references: [R1, S01, S03]
  registry: knowledge/verification/reference_verifications.jsonl

promotion:
  log: data/metadata/promotions/promotion_log.jsonl
  # Record fields a promotion may write. Everything else (provenance, rights, image path,
  # SHA-256, site, split, ...) is protected and checked unchanged before anything is written.
  writable_fields: [inscription_present, script_type, label_source, label_confidence,
                    inscription_regions, character_count_visible, transcription,
                    transcription_encoding, transliteration, transliteration_scheme,
                    translation_en, translation_ta, reading_status, alternative_readings, reading_source,
                    dating_text, dating_lower_year, dating_upper_year, dating_basis,
                    dating_reliability, dating_source, annotator, annotation_date, notes]
