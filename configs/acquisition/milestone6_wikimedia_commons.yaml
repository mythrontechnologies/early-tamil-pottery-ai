# Milestone 6 acquisition plan: Wikimedia Commons.
#
# CURATED BY AN AI ASSISTANT; EVERY SELECTION IS PENDING HUMAN REVIEW.
# This file lists candidates and records what the curator decided about each. It does
# NOT contain licences: the pipeline reads every licence from the Commons API at run
# time, and the policy (src/acquisition/policy.py) accepts or rejects each file.
# `curation_note` text describing image content is an AI-assisted observation, never a
# label. Items under `excluded` are listed so the report records why they were rejected.
#
#   python -m src.acquisition plan configs/acquisition/milestone6_wikimedia_commons.yaml            # dry run
#   python -m src.acquisition plan configs/acquisition/milestone6_wikimedia_commons.yaml --commit


