# Early Tamil Pottery AI — SYNTHETIC engineering dataset: generator configuration (Milestone 9)
#
#   SYNTHETIC — NOT ARCHAEOLOGICAL EVIDENCE
#
# The synthetic dataset exists solely for engineering and model-pipeline validation. It must
# not be interpreted as archaeological evidence or used to make claims about real Tamil Nadu
# pottery. Nothing in this file is an archaeological parameter: it controls a procedural image
# generator (src/synthetic/generator.py). See docs/SYNTHETIC_DATASET.md.
#
#   python -m src.synthetic generate     # writes data/synthetic/ (images git-ignored)
#   python -m src.synthetic split        # artifact-level split -> data/synthetic/splits/
#
# The same seed + generator_version + this file reproduce identical metadata and, with the
# same Pillow/libjpeg build, byte-identical images.

dataset_type: synthetic
generator_version: "1.0.0"     # must equal src.synthetic.generator.GENERATOR_VERSION
seed: 20261003

# Four synthetic VISUAL TASK categories, equal in size. 250 per class = 1,000 artifacts.
artifacts_per_class: 250

# Views (photographs) per artifact: always `min`; one more with probability `p_extra`, up to `max`.
views:
  min: 2
  max: 3
  p_extra: 0.2

# Output image size range in pixels (each view draws its own width and height).
canvas:
  min_px: 300
  max_px: 420
object_px: 512                 # internal rendering resolution of the sherd (supersampled)
jpeg_quality:
  min: 60
  max: 95

# Photographic conditions. Drawn identically for EVERY class, from random streams that never
# see the class, so no condition can act as a label signature.
conditions:
  rotation_degrees_max: 20
  perspective_max: 0.07        # corner jitter as a fraction of the object size
  object_fill: [0.55, 0.9]     # object diameter / shorter canvas side
  exposure: [0.65, 1.35]
  contrast: [0.75, 1.25]
  white_balance_jitter: 0.06
  blur_probability: 0.5
  blur_sigma_max: 1.6
  noise_sigma_max: 6.0
  occlusion_probability: 0.25
  occlusion_max_fraction: 0.12 # of the canvas area
  scratches_max: 6             # distractor scratches on every class
  cracks_max: 2
  pits_max: 25

# Mark content: the ONLY thing that differs between classes.
marks:
  glyphs_per_row: [3, 8]
  word_break_probability: 0.4
  graffiti_motifs: [1, 3]
  uncertain_modes: [cut_row, faint, fragment, overscratched]

# Artifact-level split (same algorithm as the research split; src/dataset/splits.py).
split:
  seed: 20261003
  train: 0.70
  val: 0.15
  test: 0.15
  min_artifacts_per_class_for_holdout: 20
  k_folds: 5
  balance_secondary: [synthetic_surface]
