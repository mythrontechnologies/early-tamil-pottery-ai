# Knowledge base: references.
#
# Only works whose existence the project has established, or that are listed in
# docs/CHRONOLOGICAL_SCOPE.md §6 with an exact title. Verification statuses:
#   verified_against_source  a human checked the specific claim in the physical publication
#   transcribed_unverified   the project read the publication (Milestones 4/6) and transcribed
